# The following fields are used for interface presentation(Front-end)
ui:
  how_to_format:
    title: Basic Formatting
    desc: >-
      <ul class="mb-0"><li><p class="mb-2">Add links</p><pre class="mb-2"><code><https://url.com><br/><br/>[Title](https://url.com)</code></pre></li><li><p class="mb-2">Separate paragraphs with an empty line</p></li><li><p class="mb-2"><em>_Italic_</em> or **<strong>Bold</strong>**</p></li><li><p class="mb-2">Use 4 spaces to indent code</p></li><li><p class="mb-2">Add <code>></code> at the start of a line to indicate a quote</p></li><li><p class="mb-2">Escape with backticks <code>`like _this_`</code></p></li><li><p class="mb-2">Use <code>```</code> to create a code block</p><pre class="mb-0"><code>```<br/>This is a code block<br/>```</code></pre></li></ul>
  formula_to_format:
    title: Mathematical Formulas
    desc: >-
      <ul class="mb-0"> <li> <p class="mb-2">Embed inline formulas using<code>$</code>$E = mc^2$</p> <pre class="mb-0"><code>$E = mc^2$</code></pre> </li> <li> <p class="mb-2">Use<code>$$</code>to place formulas on their own line$$E = mc^2$$</p> <pre class="mb-0"><code>$$E = mc^2$$</code></pre> </li> <li> <p class="mb-2">Use<code>^</code> for superscripts and<code>_</code> for subscripts$x_i^2$</p> <pre class="mb-0"><code>$x_i^2$</code></pre> </li> <li> <p class="mb-2">Express fractions using<code>\frac{numerator}{denominator}</code> $\frac{1}{2}$</p> <pre class="mb-0"><code>$\frac{1}{2}$</code></pre> </li> <li> <p class="mb-2">Use<code>\sqrt[n]{expression}</code> for nth roots$\sqrt[3]{x}$</p> <pre class="mb-0"><code>$\sqrt[3]{x}$</code></pre> </li> <li> <p class="mb-2">Indicate integrals using<code>\int_{lower}^{upper} f(x)dx</code> $\int_0^\infty e^{-x}dx$</p> <pre class="mb-0"><code>$\int_0^\infty e^{-x}dx$</code></pre> </li> <li> <p class="mb-2">Use<code>\sum_{i=1}^{n} a_i</code> for summation$\sum_{i=1}^{n} a_i$</p> <pre class="mb-0"><code>$\sum_{i=1}^{n} a_i$</code></pre> </li> <li> <p class="mb-2">Use<code>\begin{matrix} ... \end{matrix}</code> to define matrices$\begin{pmatrix} 1 & 2 \\ 3 & 4 \end{pmatrix}$</p> <pre class="mb-0">// Separate elements with &, end each row with \\<br/><code>$\begin{pmatrix} 1 & 2 \\ 3 & 4 \end{pmatrix}$</code></pre> </li> <li> <p class="mb-2">Use<code>\times</code>($\times$)<code>\div</code>($\div$)<code>\pm</code>($\pm$) to show operation symbols$a \times b \div c \pm d$</p> <pre class="mb-0">$a \times b \div c \pm d$</code></pre> </li></ul>
